name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME || 'dev-copilot-crew' }}
        run: |
          bunx wrangler@latest deploy \
            --config dist/server/wrangler.json \
            --name "$WORKER_NAME"

      - name: Show live URL
        env:
          WORKER_NAME: ${{ vars.WORKER_NAME || 'dev-copilot-crew' }}
        run: |
          echo "### التطبيق منشور ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "الرابط: https://$WORKER_NAME.<your-cloudflare-subdomain>.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "الرابط الدقيق كيبان فسجلّ خطوة \`Deploy to Cloudflare Workers\` فوق." >> $GITHUB_STEP_SUMMARY
