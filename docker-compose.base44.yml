services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
      - vault_data:/data/vault
    ports:
      - "3000:5173"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - VAULT_DIR=/data/vault
    env_file:
      - /run/base44/app.env
    command: sh -c "npm install --no-audit --no-fund && npx vite dev --host 0.0.0.0 --port 5173 --strictPort"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  web_node_modules:
  vault_data:
